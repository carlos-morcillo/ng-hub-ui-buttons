<button class="hub-dropdown-item__inner" type="button" [disabled]="disabled() || null" (click)="_handleClick()">
	@if (icon()) {
		<i [class]="icon()" aria-hidden="true"></i>
	}
	<span class="hub-dropdown-item__label"><ng-content></ng-content></span>
	@if (selected()) {
		<span class="hub-dropdown-item__check" aria-hidden="true">✓</span>
	}
</button>
